name: Generate profile trophies

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-trophy.yml"
      - "profile-tools/trophy.py"
      - "profile-tools/test_trophy.py"
      - "profile-tools/activity_graph.py"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run trophy tests
        working-directory: profile-tools
        run: python -m unittest -v test_trophy.py

      - name: Generate trophy SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p profile-assets
          python profile-tools/trophy.py \
            --username ljj13 \
            --display-name FogPurification \
            --output profile-assets/trophy.svg

      - name: Commit generated trophy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-assets/trophy.svg
          if git diff --cached --quiet; then
            echo "No trophy changes to commit."
          else
            git commit -m "chore: update profile trophies"
            git push
          fi
