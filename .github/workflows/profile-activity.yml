name: Generate activity graph

on:
  workflow_dispatch:
  schedule:
    - cron: "20 1 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-activity.yml"
      - "profile-tools/activity_graph.py"
      - "profile-tools/test_activity_graph.py"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run activity graph tests
        working-directory: profile-tools
        run: python -m unittest -v test_activity_graph.py

      - name: Generate activity graph SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p profile-assets
          python profile-tools/activity_graph.py \
            --username ljj13 \
            --display-name FogPurification \
            --output profile-assets/activity-graph.svg

      - name: Commit generated activity graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-assets/activity-graph.svg
          if git diff --cached --quiet; then
            echo "No activity graph changes to commit."
          else
            git commit -m "chore: update activity graph"
            git push
          fi
